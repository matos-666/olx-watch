# OLX watcher — polls the configured searches and Telegram-notifies on
# new listings. State (seen.json) is committed back to the repo so each
# run knows what the previous ones saw.
#
# Target lives in the WATCH dict at the top of watcher.py.
# Currently: Ray-Ban Hexagonal RB3548N sunglasses.
#
# GitHub's scheduled crons lag badly on the free tier — observed 80-98
# min between fires on a */15 schedule. Fine for a classifieds watch;
# use workflow_dispatch from the Actions tab when you want it now.

name: watch-olx

# SCHEDULE DISABLED. OLX now 403s datacenter IPs outright — every
# Actions run failed on both the JSON API and the HTML scrape, for
# every query. The watcher runs locally instead, on a residential
# connection, via launchd (see README). Manual dispatch is kept so the
# cloud path can be retested if OLX ever relaxes.
on:
  workflow_dispatch:

permissions:
  contents: write   # to commit seen.json back

concurrency:
  group: watch-olx
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 watcher.py

      - name: Commit updated state
        run: |
          if git diff --quiet seen.json 2>/dev/null && [ -f seen.json ]; then
            echo "no state change"
            exit 0
          fi
          git config user.name "olx-watch-bot"
          git config user.email "actions@github.com"
          git add seen.json
          git diff --cached --quiet && { echo "nothing staged"; exit 0; }
          git commit -m "state: update seen ads [skip ci]"
          git push
